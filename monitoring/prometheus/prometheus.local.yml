global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: tukaatu-express-local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: "/?(.*)"
        target_label: name

  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: php-fpm
    static_configs:
      - targets: ["php-fpm-exporter:9253"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: blackbox-http-plain
    metrics_path: /probe
    params:
      module: [http_2xx_plain]
    static_configs:
      - targets:
          - http://delivery-local-backend-nginx/up
          - http://delivery-local-backend-nginx/api/v1/health
          - http://delivery-local-frontend:3000
        labels:
          probe_kind: http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.tukaatuexpress.com/api/v1/health
          - https://tukaatuexpress.com
        labels:
          probe_kind: https
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
