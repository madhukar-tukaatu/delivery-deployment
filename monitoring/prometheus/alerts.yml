groups:
  - name: tukaatu-express-site
    rules:
      - alert: SiteDown
        expr: probe_success{job=~"blackbox-http.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tukaatu Express endpoint is down"
          description: "{{ $labels.instance }} has failed blackbox probes for 2 minutes."

      - alert: NginxHigh5xxRate
        expr: |
          (
            sum(rate(promtail_custom_nginx_http_responses{http_status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(promtail_custom_nginx_http_responses[5m])), 0.1)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nginx 5xx rate is above 5%"
          description: "About {{ $value | humanizePercentage }} of Nginx responses are 5xx. Check PHP-FPM and Laravel logs."

  - name: tukaatu-express-infra
    rules:
      - alert: HighHostCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU is above 85%"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}."

      - alert: HighHostMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host RAM is above 85%"
          description: "Memory usage is {{ $value | humanize }}% on {{ $labels.instance }}."

      - alert: HighHostDisk
        expr: |
          max by (device) (
            (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) * 100
          ) > 85
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Root disk is above 85% full"
          description: "Disk usage is {{ $value | humanize }}% on {{ $labels.mountpoint }}."

      - alert: ContainerRestarted
        expr: changes(container_start_time_seconds{name=~".*delivery.*"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A delivery container restarted"
          description: "Container {{ $labels.name }} started again in the last 15 minutes. Check `docker logs {{ $labels.name }}`."

      - alert: MySQLDown
        expr: mysql_up == 0 or absent(mysql_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MySQL exporter cannot reach MySQL"
          description: "mysql_up is 0 or missing. Check the exporter user, password, host, and that the monitoring stack shares the app Docker network."

      - alert: RedisDown
        expr: redis_up == 0 or absent(redis_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter cannot reach Redis"
          description: "redis_up is 0 or missing. Check REDIS_HOST and that the exporter is on the app Docker network."

      - alert: NginxExporterStale
        expr: nginx_up == 0 or absent(nginx_up)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Nginx exporter cannot scrape /stub_status"
          description: "Confirm backend-nginx has location /stub_status and was recreated after that config change. Test: docker exec delivery-nginx-exporter wget -qO- http://delivery-backend-nginx/stub_status"

      - alert: SSLCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expires in under 14 days"
          description: "{{ $labels.instance }} certificate expires in {{ $value | humanize }} days."

      - alert: QueueBacklogHigh
        expr: redis_key_size{key=~".*queues.*"} > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Laravel Redis queue backlog is high"
          description: "Key {{ $labels.key }} has {{ $value }} items. Check delivery-backend-queue and failed_jobs."
