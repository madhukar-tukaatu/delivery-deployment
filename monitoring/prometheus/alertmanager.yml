# Placeholder receiver only. Do not put real credentials in this file.
# To enable notifications, set a webhook in alertmanager.yml (or a volume
# override) and reload: curl -X POST http://127.0.0.1:9093/-/reload
global:
  resolve_timeout: 5m

route:
  receiver: placeholder
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: placeholder
      repeat_interval: 1h

receivers:
  - name: placeholder
    # webhook_configs:
    #   - url: "https://example.invalid/hooks/CHANGE_ME"
    #     send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname"]
