name: delivery-monitoring

# Production monitoring stack. Isolated from the app compose file.
# Usage (from this directory):
#   cp .env.monitoring.example .env.monitoring   # edit secrets
#   docker network ls | grep delivery            # set DELIVERY_NETWORK to the APP network
#   docker compose --env-file .env.monitoring -f docker-compose.monitoring.prod.yml up -d
#
# The `delivery` network is EXTERNAL. Compose will not create a shadow network
# if the name is wrong — the stack will fail to start instead of silently
# collecting no MySQL/Redis/Nginx data.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: delivery-prometheus
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    mem_limit: 384m
    cpus: 0.35
    networks:
      - monitoring
      - delivery

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: delivery-alertmanager
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    mem_limit: 64m
    cpus: 0.10
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    container_name: delivery-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3001}
      TZ: ${TZ:-Asia/Kathmandu}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-Asia/Kathmandu}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 256m
    cpus: 0.25
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.2.0
    container_name: delivery-loki
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 256m
    cpus: 0.25
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.0
    container_name: delivery-promtail
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - -config.file=/etc/promtail/config.yml
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    mem_limit: 128m
    cpus: 0.15
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: delivery-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 192m
    cpus: 0.20
    networks:
      - monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: delivery-mysql-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=${MYSQL_HOST:-delivery-mysql}:3306
      - --mysqld.username=${MYSQL_EXPORTER_USER:-exporter}
      - --collect.global_status
      - --collect.global_variables
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    mem_limit: 96m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: delivery-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://${REDIS_HOST:-delivery-redis}:${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_EXPORTER_CHECK_KEYS: "${REDIS_QUEUE_KEY_PATTERN:-db0=*queues*}"
    mem_limit: 64m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: delivery-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://${NGINX_HOST:-delivery-backend-nginx}:80/stub_status
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: delivery-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --no-collector.wifi
      - --no-collector.hwmon
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: delivery-php-fpm-exporter
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://${PHP_FPM_HOST:-delivery-backend-app}:9000/status"
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: delivery-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  delivery:
    external: true
    name: ${DELIVERY_NETWORK:-delivery-deployment_delivery}

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
