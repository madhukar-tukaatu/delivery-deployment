name: delivery-monitoring

# Production overlay for VPS. Safe and isolated: does NOT modify docker-compose.yml or app containers.
# Usage:
#   cp .env.monitoring.example .env.monitoring   # edit secrets
#   docker network ls | grep delivery            # confirm DELIVERY_NETWORK
#   docker compose --env-file .env.monitoring -f docker-compose.monitoring.prod.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: delivery-prometheus
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    cpus: 0.35
    networks:
      - monitoring
      - delivery

  grafana:
    image: grafana/grafana:11.3.1
    container_name: delivery-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://103.160.22.123:3001}
      TZ: ${TZ:-Asia/Kathmandu}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-Asia/Kathmandu}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 256m
    cpus: 0.25
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.2.0
    container_name: delivery-loki
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 256m
    cpus: 0.25
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.0
    container_name: delivery-promtail
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kathmandu}
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    mem_limit: 128m
    cpus: 0.15
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: delivery-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 192m
    cpus: 0.20
    networks:
      - monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: delivery-mysql-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysql/my.cnf
    volumes:
      - ./prometheus/my.cnf.prod:/etc/mysql/my.cnf:ro
    mem_limit: 96m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: delivery-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://${REDIS_HOST:-delivery-redis}:6379"
    mem_limit: 64m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: delivery-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://${NGINX_HOST:-delivery-backend-nginx}:80/stub_status
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring
      - delivery

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: delivery-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    mem_limit: 48m
    cpus: 0.10
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  delivery:
    driver: bridge
    name: ${DELIVERY_NETWORK:-delivery-deployment_delivery}

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
