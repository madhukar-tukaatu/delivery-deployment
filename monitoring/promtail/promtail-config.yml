server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  # 1. Scrape all Docker containers running Delivery Express services
  - job_name: delivery-docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Keep containers matching delivery or express
      - source_labels: ['container']
        regex: '.*delivery.*'
        action: keep
    pipeline_stages:
      # Docker log json format: {"log": "...", "stream": "stdout", "time": "..."}
      - json:
          expressions:
            output: log
            stream: stream
            log_time: time

      # Multiline support for Laravel stack traces:
      # Starts with [YYYY-MM-DD HH:MM:SS]
      - multiline:
          firstline: '^(\[\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\]|^\d{4}/\d{2}/\d{2})'
          max_wait_time: 3s
          max_lines: 500

      # Extract log level (ERROR, WARNING, INFO, DEBUG, CRITICAL)
      - regex:
          expression: '(?i)\b(?P<level>EMERGENCY|ALERT|CRITICAL|ERROR|WARNING|NOTICE|INFO|DEBUG)\b'
      - labels:
          level:

      # For Nginx access logs: extract HTTP status and method if present
      - regex:
          expression: '\"(?P<http_method>GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)\s+(?P<http_path>[^\s]+)\s+HTTP/[0-9.]+\"\s+(?P<http_status>\d{3})'
      - labels:
          http_status:
          http_method:

      - timestamp:
          source: log_time
          format: RFC3339Nano

      - output:
          source: output

