server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: delivery-docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['container']
        regex: '.*delivery.*'
        action: keep
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            log_time: time

      - multiline:
          firstline: '^(\[\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\]|^\d{4}/\d{2}/\d{2})'
          max_wait_time: 3s
          max_lines: 500

      - regex:
          expression: '(?i)\b(?P<level>EMERGENCY|ALERT|CRITICAL|ERROR|WARNING|NOTICE|INFO|DEBUG)\b'
      - labels:
          level:

      - regex:
          expression: '\"(?P<http_method>GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)\s+(?P<http_path>[^\s]+)\s+HTTP/[0-9.]+\"\s+(?P<http_status>\d{3})'
      - labels:
          http_status:
          http_method:

      # Export Nginx status codes as a Prometheus counter (scraped from :9080).
      - match:
          selector: '{container=~".*nginx.*"}'
          stages:
            - metrics:
                nginx_http_responses:
                  type: Counter
                  description: "Nginx HTTP responses by status"
                  source: http_status
                  prefix: promtail_custom_
                  max_idle_duration: 24h
                  config:
                    action: inc

      - timestamp:
          source: log_time
          format: RFC3339Nano

      - output:
          source: output
