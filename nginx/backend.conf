server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;

    # Request size/shape limits (PHP2Shell CVE-2026-109618 guidance). Keep in sync with php.ini post_max_size.
    client_max_body_size 64M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 15s;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Docker DNS: re-resolve backend-app after container recreate (avoids stale IP / Network Error)
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri $uri/ =404;
    }

    # Never execute PHP from user-uploaded storage
    location ~* ^/storage/.*\.(php|phar|phtml|php\d)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        set $php_upstream backend-app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 10s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}