services:
  mysql:
    image: mysql:8.0
    container_name: delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - delivery

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - delivery

  backend-app:
    build:
      context: ../delivery-backend
    container_name: delivery-backend-app
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - mysql
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - delivery
    command: php-fpm

  backend-queue:
    build:
      context: ../delivery-backend
    container_name: delivery-backend-queue
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - backend-app
      - mysql
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - delivery
    command: php artisan queue:work redis --queue=high,broadcasts,notifications,webhooks,settlements,reports,default --tries=3 --timeout=120

  backend-scheduler:
    build:
      context: ../delivery-backend
    container_name: delivery-backend-scheduler
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - backend-app
      - mysql
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - delivery
    command: php artisan schedule:work

  backend-reverb:
    build:
      context: ../delivery-backend
    container_name: delivery-backend-reverb
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - backend-app
      - redis
    volumes:
      - backend_storage:/var/www/html/storage
    ports:
      - "8080:8080"
    networks:
      - delivery
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  backend-nginx:
    image: nginx:alpine
    container_name: delivery-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend-app
    ports:
      - "8081:80"
    volumes:
      - ../delivery-backend:/var/www/html:ro
      - backend_storage:/var/www/html/storage:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - delivery

  frontend:
    build:
      context: ../delivery-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
    container_name: delivery-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    networks:
      - delivery

networks:
  delivery:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_storage: